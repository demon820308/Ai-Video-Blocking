<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1320"/>
      <stop offset="100%" stop-color="#141c2b"/>
    </linearGradient>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .bad { font-size: 13px; font-weight: 700; fill: #f87171; }
      .good { font-size: 13px; font-weight: 700; fill: #34d399; }
      .desc { font-size: 12px; fill: #cbd5e1; }
      .muted { font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="960" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="318" rx="15" fill="none" stroke="#243045" stroke-width="1.5"/>

  <text x="480" y="34" text-anchor="middle" class="font h">4 Common AI Video Failures vs. Ai-Video-Blocking</text>

  <!-- Card 1 -->
  <rect x="28" y="54" width="216" height="240" rx="12" fill="#182234" stroke="#2d3c56" stroke-width="1.2"/>
  <text x="44" y="82" class="font bad">✗ Axis Flip &amp; Swaps</text>
  <text x="44" y="106" class="font muted">Shot 1: A on left looking right.</text>
  <text x="44" y="123" class="font muted">Shot 2: A jumps to the right.</text>
  <line x1="44" y1="142" x2="228" y2="142" stroke="#2d3c56" stroke-width="1"/>
  <text x="44" y="168" class="font good">✓ Fixed Coords + 180° Axis</text>
  <text x="44" y="192" class="font desc">Locks cardinal landmarks first,</text>
  <text x="44" y="210" class="font desc">keeps OTS cameras on one side,</text>
  <text x="44" y="228" class="font desc">recomputes screen L/C/R per cut.</text>
  <rect x="44" y="250" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="136" y="268" text-anchor="middle" class="font muted" style="fill:#38bdf8;">Consistent Screen Direction</text>

  <!-- Card 2 -->
  <rect x="258" y="54" width="216" height="240" rx="12" fill="#182234" stroke="#2d3c56" stroke-width="1.2"/>
  <text x="274" y="82" class="font bad">✗ Teleporting Props</text>
  <text x="274" y="106" class="font muted">Envelope starts in right hand,</text>
  <text x="274" y="123" class="font muted">jumps to left or vanishes mid-cut.</text>
  <line x1="274" y1="142" x2="458" y2="142" stroke="#2d3c56" stroke-width="1"/>
  <text x="274" y="168" class="font good">✓ Body L/R ↔ Screen L/R</text>
  <text x="274" y="192" class="font desc">Tracks character's own L/R hand,</text>
  <text x="274" y="210" class="font desc">maps facing-cam left = screen right,</text>
  <text x="274" y="228" class="font desc">defines exact handoff &amp; empty hand.</text>
  <rect x="274" y="250" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="366" y="268" text-anchor="middle" class="font muted" style="fill:#38bdf8;">Locked Prop Continuity</text>

  <!-- Card 3 -->
  <rect x="488" y="54" width="216" height="240" rx="12" fill="#182234" stroke="#2d3c56" stroke-width="1.2"/>
  <text x="504" y="82" class="font bad">✗ Overloaded Blocking</text>
  <text x="504" y="106" class="font muted">Packing 4 actions + 360° orbit</text>
  <text x="504" y="123" class="font muted">into 5s causes clipping &amp; warp.</text>
  <line x1="504" y1="142" x2="688" y2="142" stroke="#2d3c56" stroke-width="1"/>
  <text x="504" y="168" class="font good">✓ Rehearsable Paths &amp; Splits</text>
  <text x="504" y="192" class="font desc">Specifies front/behind passes &amp;</text>
  <text x="504" y="210" class="font desc">re-entry side after occlusion;</text>
  <text x="504" y="228" class="font desc">flags overload &amp; suggests splits.</text>
  <rect x="504" y="250" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="596" y="268" text-anchor="middle" class="font muted" style="fill:#38bdf8;">Executable Choreography</text>

  <!-- Card 4 -->
  <rect x="718" y="54" width="214" height="240" rx="12" fill="#182234" stroke="#2d3c56" stroke-width="1.2"/>
  <text x="734" y="82" class="font bad">✗ Blind Rerolls</text>
  <text x="734" y="106" class="font muted">Background or outfit drifts, and</text>
  <text x="734" y="123" class="font muted">you rewrite the whole prompt.</text>
  <line x1="734" y1="142" x2="916" y2="142" stroke="#2d3c56" stroke-width="1"/>
  <text x="734" y="168" class="font good">✓ Visual QA + Local Patches</text>
  <text x="734" y="192" class="font desc">Inspects keyframes &amp; samples,</text>
  <text x="734" y="210" class="font desc">pinpoints first deviation time,</text>
  <text x="734" y="228" class="font desc">outputs drop-in local fixes only.</text>
  <rect x="734" y="250" width="182" height="28" rx="6" fill="#0f172a"/>
  <text x="825" y="268" text-anchor="middle" class="font muted" style="fill:#38bdf8;">Fast, Surgical Iteration</text>
</svg>
